_format_version: "3.0"
_transform: true

########################################################
# SERVICES
########################################################

services:
  - name: knowledge-risk-analyzer
    host: knowledge-risk-analyzer
    port: 443
    protocol: https
    path: /api
    retries: 5
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: knowledge-risk-analyzer-get-api-v1-payments-risk-bus-factor
        protocols:
          - https
          - http
        methods:
          - GET
        hosts:
          - api.example.com
        paths:
          - /api/v1/payments/risk/bus-factor
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426
      - name: knowledge-risk-analyzer-get-api-v1-payments-risk-orphaned
        protocols:
          - https
          - http
        methods:
          - GET
        hosts:
          - api.example.com
        paths:
          - /api/v1/payments/risk/orphaned
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426
      - name: knowledge-risk-analyzer-get-api-v1-payments-risk-team-scorecard
        protocols:
          - https
          - http
        methods:
          - GET
        hosts:
          - api.example.com
        paths:
          - /api/v1/payments/risk/team-scorecard
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426
      - name: knowledge-risk-analyzer-post-api-v1-payments-risk-simulate-departure
        protocols:
          - https
          - http
        methods:
          - POST
        hosts:
          - api.example.com
        paths:
          - /api/v1/payments/risk/simulate-departure
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426

########################################################
# PLUGINS
########################################################

plugins:
  []

########################################################
# UPSTREAMS + TARGETS
########################################################

upstreams:
  - name: knowledge-risk-analyzer
    algorithm: round-robin
    slots: 10000
    targets:
      - target: api.example.com:443
        weight: 100
